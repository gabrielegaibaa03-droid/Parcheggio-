<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcheggio</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parcheggio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#000;color:#fff;font-family:Inter,-apple-system,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;
       padding:calc(env(safe-area-inset-top) + 8vh) 28px calc(env(safe-area-inset-bottom) + 28px)}
  #go{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;border:0;background:#fff;color:#000;
      font:800 min(30vw,128px)/1 Inter,sans-serif;cursor:pointer;transition:transform .15s,opacity .2s}
  #go:active{transform:scale(.95)}
  #go.wait{opacity:.35}
  .hint{margin-top:22px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#666;font-weight:500}
  #info{margin-top:8vh;text-align:center;width:100%;max-width:420px}
  .ok{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#666;font-weight:500}
  .via{font-size:30px;font-weight:300;line-height:1.2;margin-top:10px}
  .when{color:#666;font-size:15px;margin-top:8px}
  .nav{display:inline-block;margin-top:26px;color:#fff;text-decoration:none;font-size:15px;font-weight:500;
       border-bottom:1px solid #444;padding-bottom:3px}
  .err{color:#ff6b6b;font-size:15px;line-height:1.4}
  #storico{margin-top:auto;width:100%;max-width:420px;padding-top:40px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid #1a1a1a;
       color:#555;font-size:14px;text-decoration:none}
  #manuale{margin-top:14px;background:none;border:0;color:#444;font:500 13px Inter,sans-serif;text-decoration:underline;cursor:pointer}
  #form{display:none;margin-top:18px;width:100%;max-width:420px;gap:8px}
  #form input{flex:1;background:#111;border:1px solid #222;border-radius:12px;color:#fff;font:16px Inter,sans-serif;padding:13px 14px;outline:none}
  #form button{background:#fff;color:#000;border:0;border-radius:12px;font:600 15px Inter,sans-serif;padding:0 18px}
  .row b{color:#999;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<button id="go" aria-label="Ho parcheggiato qui">P</button>
<div class="hint" id="hint">Tocca quando parcheggi</div>
<button id="manuale">oppure scrivi la via</button>
<form id="form"><input id="indirizzo" placeholder="es. Via Barberia 30A" autocomplete="off"><button>Salva</button></form>

<div id="info"></div>
<div id="storico"></div>

<script>
const KEY="parcheggi_v1";
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(0,100)))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function maps(p){return "https://www.google.com/maps/search/?api=1&query="+(p.lat!=null?p.lat+","+p.lng:encodeURIComponent(p.via+", Bologna"))}
function giorno(ts){return new Date(ts).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}
function ora(ts){return new Date(ts).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}
function nome(p){return p.via||(p.lat.toFixed(5)+", "+p.lng.toFixed(5))}

function render(appena){
  const a=load();
  if(!a.length){$("info").innerHTML="";$("storico").innerHTML="";return}
  const p=a[0];
  $("info").innerHTML=
    '<div class="ok">'+(appena?"Perfetto, l'hai lasciata in":"La macchina è in")+'</div>'+
    '<div class="via">'+esc(nome(p))+'</div>'+
    '<div class="when">'+giorno(p.ts)+' · '+ora(p.ts)+'</div>'+
    '<a class="nav" href="'+maps(p)+'" target="_blank" rel="noopener">Portami lì →</a>';
  $("storico").innerHTML=a.slice(1,6).map(x=>
    '<a class="row" href="'+maps(x)+'" target="_blank" rel="noopener"><b>'+esc(nome(x))+'</b><span>'+giorno(x.ts)+' · '+ora(x.ts)+'</span></a>').join("");
}

async function via(lat,lng){
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=it&lat="+lat+"&lon="+lng);
    const ad=(await r.json()).address||{};
    const s=ad.road||ad.pedestrian||ad.square||ad.footway||"";
    return s?s+(ad.house_number?" "+ad.house_number:""):null;
  }catch(e){return null}
}

$("go").onclick=()=>{
  const b=$("go");
  if(b.classList.contains("wait"))return;
  if(!navigator.geolocation){$("info").innerHTML='<div class="err">Posizione non disponibile su questo telefono.</div>';return}
  b.classList.add("wait");$("hint").textContent="Cerco la posizione…";
  navigator.geolocation.getCurrentPosition(async pos=>{
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,ts:Date.now()};
    const a=load();a.unshift(p);save(a);render(true);
    const v=await via(p.lat,p.lng);
    if(v){const a2=load();if(a2[0]&&a2[0].ts===p.ts){a2[0].via=v;save(a2);render(true)}}
    b.classList.remove("wait");$("hint").textContent="Tocca quando parcheggi";
  },err=>{
    b.classList.remove("wait");$("hint").textContent="Tocca quando parcheggi";
    $("info").innerHTML='<div class="err">'+(err.code===1?"Consenti la posizione nelle impostazioni del telefono.":"Posizione non trovata, riprova.")+'</div>';
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
};
$("manuale").onclick=()=>{$("form").style.display="flex";$("manuale").style.display="none";$("indirizzo").focus()};
$("form").onsubmit=async e=>{
  e.preventDefault();
  const t=$("indirizzo").value.trim(); if(!t)return;
  const p={via:t,lat:null,lng:null,ts:Date.now()};
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=it&q="+encodeURIComponent(t+", Bologna"));
    const j=await r.json(); if(j[0]){p.lat=+j[0].lat;p.lng=+j[0].lon}
  }catch(e){}
  const a=load();a.unshift(p);save(a);
  $("indirizzo").value="";$("form").style.display="none";$("manuale").style.display="";
  render(true);
};
render(false);
</script>
</body>
</html>
